<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beneficiary QR - Smart Relief</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- QR Code generation for frontend if backend didn't send data URI, but we can also just use the backend generated link if we want, or generate it dynamically here. We'll use CDN for qrcode.js to draw it nicely on canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .qr-card {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
            border: 2px solid var(--primary);
            padding: 2rem;
            border-radius: var(--radius);
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0;
        }
        #qrcode img {
            border-radius: 8px;
        }
        .b-detail {
            margin: 0.5rem 0;
            font-size: 1.125rem;
        }
        
        @media print {
            body * {
                visibility: hidden;
            }
            .qr-card, .qr-card * {
                visibility: visible;
            }
            .qr-card {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar no-print">
        <div class="sidebar-header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            Smart Relief
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> Dashboard</a>
            <a href="register.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> Register</a>
            <a href="manage.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Manage IDs</a>
            <a href="scan.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M7 7h.01M17 7h.01M7 17h.01M17 17h.01"/></svg> Scan QR</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header no-print">
            <h1 class="page-title">Beneficiary QR ID</h1>
        </header>

        <section class="card qr-card" id="qrContainer">
            <h2 id="b-name" style="margin-top: 0; color: var(--primary);">Loading...</h2>
            <div class="b-detail" style="color: var(--text-muted);" id="b-id"></div>
            
            <div id="qrcode"></div>
            
            <div class="b-detail" id="b-phone"></div>
            <div class="b-detail" id="b-address"></div>
            <div class="b-detail">
                Priority: <strong id="b-priority"></strong>
            </div>

            <button class="btn btn-secondary no-print" onclick="window.print()" style="margin-top: 2rem; width: 100%;">Print ID Card</button>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const qrId = urlParams.get('qrId');

            if (!qrId) {
                showMessage('error', 'No QR ID specified.');
                document.getElementById('b-name').innerText = 'ID Not Found';
                return;
            }

            const response = await api.beneficiary.get(qrId);

            if (response.success) {
                const b = response.data;
                document.getElementById('b-name').innerText = b.name;
                document.getElementById('b-id').innerText = `ID: ${b.qrId}`;
                document.getElementById('b-phone').innerText = `Phone: ${b.phone}`;
                document.getElementById('b-address').innerText = `Loc: ${b.address}`;
                document.getElementById('b-priority').innerText = b.priority;

                // Generate QR
                new QRCode(document.getElementById("qrcode"), {
                    text: b.qrId,
                    width: 200,
                    height: 200,
                    colorDark : "#1F2937",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } else {
                showMessage('error', 'Beneficiary not found.');
                document.getElementById('b-name').innerText = 'Beneficiary Not Found';
            }
        });
    </script>
</body>
</html>
