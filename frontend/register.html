<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Onboard Beneficiary - Smart Relief</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            Smart Relief
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> Dashboard</a>
            <a href="register.html" class="nav-link active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> Register</a>
            <a href="manage.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Manage IDs</a>
            <a href="scan.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M7 7h.01M17 7h.01M7 17h.01M17 17h.01"/></svg> Scan QR</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <h1 class="page-title">Onboard Beneficiary</h1>
            <p style="color: var(--text-muted)">Initialize a new digital identity for disaster-relief distribution.</p>
        </header>

        <section class="card" style="max-width: 700px; margin: 0 auto;">
            <header style="margin-bottom: 2.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem;">
                <h3 style="margin:0; font-size: 1.25rem;">Beneficiary Particulars</h3>
            </header>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Legal Full Name</label>
                    <input type="text" id="name" required placeholder="e.g. Alexander Walker">
                </div>
                
                <div class="form-group-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                    <div class="form-group" style="margin:0">
                        <label for="age">Current Age</label>
                        <input type="number" id="age" required placeholder="Age">
                    </div>
                    <div class="form-group" style="margin:0">
                        <label for="phone">Active Contact Number</label>
                        <input type="tel" id="phone" required placeholder="+1 (000) 000-0000">
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Primary Residential Location</label>
                    <textarea id="address" required placeholder="District, Ward, House No." style="min-height: 100px; resize: vertical;"></textarea>
                </div>

                <div class="form-group">
                    <label for="priority">Relief Priority Status</label>
                    <select id="priority">
                        <option value="Low">Low - Stable condition</option>
                        <option value="Medium" selected>Medium - Needs regular assistance</option>
                        <option value="High">High - Emergency/Critical</option>
                    </select>
                </div>

                <div class="biometric-section" style="margin-top: 2.5rem; padding: 2rem; background: rgba(255,255,255,0.03); border: 1px dashed var(--border); border-radius: 16px; text-align: center;">
                    <h3 style="margin-top:0; font-size: 1.1rem; color: var(--secondary); display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="M12 7v1M12 16v1M7 12H6M18 12h-1"/></svg>
                        Biometric Enrollment
                    </h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">Capture a high-quality face photo for AI verification during aid distribution.</p>
                    
                    <div id="face-container" style="position: relative; width: 240px; height: 240px; margin: 0 auto; border-radius: 50%; overflow: hidden; border: 4px solid var(--border); background: #000; box-shadow: 0 0 30px rgba(0,0,0,0.5);">
                        <video id="face-video" autoplay muted playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
                        <canvas id="face-canvas" style="display: none;"></canvas>
                        <div id="capture-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid var(--primary); border-radius: 50%; pointer-events: none; opacity: 0.5;"></div>
                    </div>
                    
                    <div id="captured-preview" style="display: none; margin: 1.5rem auto; width: 120px; height: 120px; border-radius: 12px; border: 2px solid var(--success); overflow: hidden;">
                        <img id="face-image" src="" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>

                    <button type="button" id="btn-capture" class="btn btn-secondary" style="margin-top: 1.5rem; display: flex; align-items: center; gap: 0.5rem; justify-content: center; width: 240px; margin-left: auto; margin-right: auto;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        Capture Biometric Data
                    </button>
                    <input type="hidden" id="facePhoto">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; height: 3.5rem; font-size: 1.1rem; margin-top: 2rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>
                    Register & Provision QR
                </button>
            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        (function() {
            const video = document.getElementById('face-video');
            const canvas = document.getElementById('face-canvas');
            const captureBtn = document.getElementById('btn-capture');
            const facePhotoInput = document.getElementById('facePhoto');
            const preview = document.getElementById('captured-preview');
            const faceImage = document.getElementById('face-image');

            // Initialize Camera
            async function initCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user", width: 480, height: 480 } 
                    });
                    video.srcObject = stream;
                } catch (err) {
                    console.error("Camera access denied:", err);
                    showMessage('error', 'Camera access required for Biometric Enrollment.');
                }
            }

            captureBtn.addEventListener('click', () => {
                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                facePhotoInput.value = dataUrl;
                faceImage.src = dataUrl;
                preview.style.display = 'block';
                
                captureBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Photo Captured';
                captureBtn.classList.remove('btn-secondary');
                captureBtn.classList.add('btn-primary');
                
                showMessage('success', 'Biometric frame captured.');
            });

            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                if (!facePhotoInput.value) {
                    showMessage('error', 'Please capture a biometric face photo first.');
                    return;
                }

                const submitBtn = e.target.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                
                submitBtn.disabled = true;
                submitBtn.innerText = 'Provisioning Protocol...';

                const data = {
                    name: document.getElementById('name').value,
                    age: document.getElementById('age').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    priority: document.getElementById('priority').value,
                    facePhoto: facePhotoInput.value
                };

                const response = await api.beneficiary.register(data);
                
                if (response.success) {
                    showMessage('success', 'Digital ID & Biometrics provisioned.');
                    setTimeout(() => {
                        window.location.href = `qr.html?qrId=${response.data.beneficiary.qrId}`;
                    }, 1500);
                } else {
                    showMessage('error', response.error || 'Provisioning failed.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                }
            });

            initCamera();
        })();
    </script>
</body>
</html>
