<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scan & Distribute - Smart Relief</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <!-- html5-qrcode CDN -->
    <script
      src="https://unpkg.com/html5-qrcode"
      type="text/javascript"
    ></script>
    <style>
      #reader {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        border-radius: var(--radius);
        overflow: hidden;
        border: 2px solid var(--border);
      }
      .scan-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .scanned-info {
        display: none;
        margin-top: 2rem;
        padding: 1.5rem;
        background: rgba(30, 41, 59, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-main);
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
        </svg>
        Smart Relief
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-link"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          </svg>
          Dashboard</a
        >
        <a href="register.html" class="nav-link"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="8.5" cy="7" r="4" />
            <line x1="20" y1="8" x2="20" y2="14" />
            <line x1="23" y1="11" x2="17" y2="11" />
          </svg>
          Register</a
        >
        <a href="manage.html" class="nav-link"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Manage IDs</a
        >
        <a href="scan.html" class="nav-link active"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
            <path d="M7 7h.01M17 7h.01M7 17h.01M17 17h.01" />
          </svg>
          Scan QR</a
        >
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <h1 class="page-title">Scan QR Code</h1>
        <p style="color: var(--text-muted)">
          Verify beneficiary identity and distribute aid.
        </p>
      </header>

      <section class="card scan-container">
        <div id="reader"></div>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
          <button id="btn-start" class="btn btn-primary">Start Scanner</button>
          <button id="btn-stop" class="btn btn-secondary" style="display: none">
            Stop Scanner
          </button>
        </div>

        <div style="margin-top: 1rem; width: 100%; max-width: 500px">
          <p style="text-align: center; color: var(--text-muted)">
            OR Manual Verification
          </p>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap;">
            <input
              type="text"
              id="manual-qr"
              placeholder="Enter QR ID manually"
            />
            <button id="btn-manual" class="btn btn-secondary">Verify</button>
          </div>
        </div>
      </section>

      <!-- Beneficiary Info & Record Aid Form -->
      <section class="card scanned-info" id="info-section">
        <div
          style="
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1rem;
          "
        >
          <h2 id="b-name" style="margin-top: 0; color: var(--primary)">
            Beneficiary Name
          </h2>
          <button
            class="btn btn-secondary"
            onclick="capturePhoto()"
            style="padding: 0.5rem 1rem; font-size: 0.875rem"
          >
            📷 Capture Photo
          </button>
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
          "
        >
          <div><strong>Age:</strong> <span id="b-age"></span></div>
          <div><strong>Phone:</strong> <span id="b-phone"></span></div>
          <div><strong>Address:</strong> <span id="b-address"></span></div>
          <div>
            <strong>Priority:</strong>
            <span id="b-priority" class="badge"></span>
          </div>
        </div>
        <div id="photo-container" style="display: none; margin-bottom: 1rem">
          <img
            id="beneficiary-photo"
            style="
              width: 150px;
              height: 150px;
              object-fit: cover;
              border-radius: var(--radius);
              border: 2px solid var(--border);
            "
            alt="Beneficiary Photo"
          />
        </div>

        <hr
          style="
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
          "
        />

        <h3>Distribute Aid</h3>
        <form id="distributeForm">
          <input type="hidden" id="distribute-qr" />

          <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1">
              <label>Aid Type (Select)</label>
              <select id="items" required>
                <option value="Food Package">Food Package</option>
                <option value="Water Supplies">Water Supplies</option>
                <option value="Medical Kit">Medical Kit</option>
                <option value="Clothing">Clothing</option>
                <option value="Emergency Shelter">Emergency Shelter</option>
                <option value="Hygiene Kit">Hygiene Kit</option>
              </select>
            </div>
            <div class="form-group" style="flex: 1">
              <label>Distribution Region</label>
              <select id="region" required>
                <option value="North Zone">North Zone</option>
                <option value="South Zone">South Zone</option>
                <option value="East Zone">East Zone</option>
                <option value="West Zone">West Zone</option>
                <option value="Central Zone">Central Zone</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Special Notes (Optional)</label>
            <input
              type="text"
              id="notes"
              placeholder="Any special requirements or notes..."
            />
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%">
            Record Aid Distribution
          </button>
        </form>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/scanner.js"></script>
  </body>
</html>
